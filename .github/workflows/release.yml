name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
            strip: strip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            strip: aarch64-linux-gnu-strip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang

      - name: Install bpf-linker
        run: |
          curl -L https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst -o /tmp/bpf-linker.tar.zst
          mkdir -p "$HOME/.local/bin"
          tar -xpf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            profile-bee-ebpf

      - name: Build eBPF
        # Build from inside profile-bee-ebpf so its .cargo/config (target-dir =
        # ../target) applies and the object lands at
        # target/bpfel-unknown-none/release/profile-bee, where profile-bee's
        # build.rs looks for it. Using --manifest-path from the repo root puts
        # it in profile-bee-ebpf/target/ instead, so build.rs silently falls
        # back to the (stale) committed prebuilt. Matches the CI e2e job.
        run: cd profile-bee-ebpf && cargo +nightly build --release -Z build-std=core --target bpfel-unknown-none

      - name: Build profile-bee (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build profile-bee (aarch64 static)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip debug info (preserves symbol table for profiling)
        run: |
          ${{ matrix.strip }} --strip-debug target/${{ matrix.target }}/release/probee
          ${{ matrix.strip }} --strip-debug target/${{ matrix.target }}/release/pbee

      - name: Show binary info
        run: |
          ls -lh target/${{ matrix.target }}/release/probee
          file target/${{ matrix.target }}/release/probee

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf profile-bee-${{ matrix.name }}.tar.gz probee pbee
          mv profile-bee-${{ matrix.name }}.tar.gz ${{ github.workspace }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile-bee-${{ matrix.name }}
          path: profile-bee-${{ matrix.name }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Extract version and changelog for this release
          VERSION="${TAG_NAME#v}"

          # Create release with changelog
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/zz85/profile-bee/blob/main/CHANGELOG.md) for details." \
            artifacts/profile-bee-linux-x86_64/profile-bee-linux-x86_64.tar.gz \
            artifacts/profile-bee-linux-aarch64/profile-bee-linux-aarch64.tar.gz
